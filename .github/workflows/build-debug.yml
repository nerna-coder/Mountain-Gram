name: Build Mountain Gram (debug)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install NDK from build.gradle
        run: |
          NDK=$(grep -rhoE 'ndkVersion\s*"?[0-9.]+' --include=build.gradle . | head -1 | grep -oE '[0-9.]+$')
          echo "NDK version: $NDK"
          yes | sdkmanager "ndk;$NDK" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1"

      - name: Inject API keys
        run: |
          F=TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          sed -i -E 's/(APP_ID\s*=\s*)[0-9]+;/\1${{ secrets.TG_API_ID }};/' $F
          sed -i -E 's/(APP_HASH\s*=\s*")[^"]*"/\1${{ secrets.TG_API_HASH }}"/' $F

      - name: Rename app (package + title)
        run: |
          sed -i 's/org\.telegram\.messenger\.web/org.mountaingram.messenger/g' TMessagesProj_App/build.gradle
          grep -rl '<string name="AppName">' TMessagesProj/src/main/res/values* | xargs sed -i -E 's#(<string name="AppName">)[^<]*#\1Mountain Gram#'

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: MountainGram-debug-APK
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
