name: Mountain Gram CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout с субмодулями
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Настройка JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Настройка Android SDK
        uses: android-actions/setup-android@v3

      - name: Установка NDK 27.2.12479018
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Запись API ключей из секретов
        run: |
          sed -i "s/APP_ID = 0/APP_ID = ${{ secrets.TELEGRAM_API_ID }}/" \
            TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          sed -i "s/APP_HASH = \"\"/APP_HASH = \"${{ secrets.TELEGRAM_API_HASH }}\"/" \
            TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java

      - name: Права на gradlew
        run: chmod +x gradlew

      - name: Сборка debug APK
        run: ./gradlew :TMessagesProj_App:assembleAfatDebug

      - name: Загрузка артефакта
        uses: actions/upload-artifact@v4
        with:
          name: MountainGram-debug
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
          retention-days: 7
